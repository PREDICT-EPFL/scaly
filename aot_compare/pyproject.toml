[project]
name = "aot-compare"
version = "0"
description = "The npmpc Lagrangian Hessian from Scaly, and from JAX with asdex lowered ahead of time through XLA and IREE, in one gbench harness."
requires-python = "==3.12.*"
dependencies = [
  "scaly",
  "jax==0.11.2",
  "asdex==0.5.2",
  "flatbuffers",
  "iree-base-compiler==3.12.0",
  "cmake",
  "ninja",
]

[dependency-groups]
# TensorFlow's AOT compiler, which the xla backend needs; it has Linux wheels only.
xla = ["tensorflow-cpu==2.21.0"]

[tool.uv]
package = false

[tool.uv.sources]
scaly = { path = "..", editable = true }
