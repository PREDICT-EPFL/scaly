[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fastbench"
version = "0.1.0"
description = "A reproducible benchmark for optimization-based (embedded) control"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FastBench contributors" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "casadi>=3.6",
    "osqp>=1.0",
    "piqp>=0.4",
    "proxsuite>=0.6",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tabulate>=0.9",
]

[project.optional-dependencies]
report = ["markdown>=3.4"]
dompc = ["do-mpc>=4.6"]
dev = ["pytest>=7.0"]

[project.scripts]
fastbench = "fastbench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fastbench*"]
