name: Platforms

on:
  push:
    branches: [main]
    paths-ignore: ["internal/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platforms:
    uses: ./.github/workflows/ci-platform.yml
    with:
      include-slow: true

  verify:
    uses: ./.github/workflows/ci-platform.yml
    with:
      suite: verify
      include-slow: true
      environments: '[{"platform":"linux-x86_64","runner":"ubuntu-latest"}]'

  # Generated C for Cortex-A53 runs under user-mode emulation, so this checks values, not speed.
  cortex-a53:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Install zig and qemu-aarch64
        env:
          SCALY_BUILD_SOLVERS: skip
        run: |
          uv sync --frozen --extra toolchain
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          uv run zig version
          qemu-aarch64 --version

      - name: Build for Cortex-A53, run under qemu and compare with NumPy
        run: uv run pytest -q -rs tests/codegen/test_cortex_a53.py

  report:
    needs: [platforms, verify, cortex-a53]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: 🔴 Platforms CI is failing
      ALERT_LABEL: ci:platforms-failing
      WORKFLOW_NAME: Platforms
      NEEDS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - run: bash .github/scripts/report-ci.sh
