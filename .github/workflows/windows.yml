name: Windows installed wheels

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x86-64 / Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_NO_SYNC: "1"
      SCALY_BUILD_SOLVERS: skip
      SCALY_REQUIRE_SOLVERS: piqp,sqp
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - uses: actions/download-artifact@v8
        with:
          name: dist-scaly-piqp-windows-latest
          path: dist

      - name: Build the pure wheels
        run: |
          uv build --wheel -o dist .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv build --wheel -o dist plugins/scaly-sqp

      - name: Fresh installation without the toolchain extra
        run: uv run --no-project .github/scripts/windows_install.py dist ${{ matrix.python }}

      - name: Install test dependencies and built wheels
        run: |
          uv sync --frozen --no-install-package scaly --no-install-package scaly-piqp --no-install-package scaly-sqp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --only-binary :all: (Get-ChildItem dist/*.whl).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync .github/scripts/windows_install.py --installed

      - name: Strict type check
        run: uv run ty check --error-on-warning

      - name: Pytest against installed core and solver wheels
        run: uv run pytest -n=auto

      - name: Windows benchmark smoke
        if: ${{ !cancelled() }}
        run: uv run benchmarks/run.py smoke
