name: CI

# Pull requests and the merge queue run the same jobs. `ci` is the one required check.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The title is read when the step runs, so re-running the job checks a corrected title.
      - name: Reject conventional-commit prefixes in the title
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          TITLE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .title)
          if printf '%s' "$TITLE" | grep -Eq '^[a-z]+(\([^)]*\))?!?: '; then
            echo "::error::The title becomes the squash commit title on main. Drop the prefix and write a plain imperative title, such as 'Merge CI test jobs'."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: uv sync (Python/core and toolchain)
        env:
          SCALY_BUILD_SOLVERS: skip
        run: uv sync --frozen --extra toolchain

      - name: Ruff lint
        if: ${{ !cancelled() }}
        run: uv run ruff check .

      - name: Ruff format check
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .

      - name: ty at the oldest supported Python
        if: ${{ !cancelled() }}
        run: uv run ty check --error-on-warning .

      - name: ty at Python 3.14
        if: ${{ !cancelled() }}
        run: uv run ty check --error-on-warning --python-version 3.14 .

      - name: ty for Windows
        if: ${{ !cancelled() }}
        run: uv run ty check --error-on-warning --python-platform win32 .

      - name: Pytest node-ID baseline
        if: ${{ !cancelled() }}
        run: uv run pytest --collect-only -q -m=

      - name: Cortex-M build tools
        run: |
          uv run --frozen --extra toolchain zig version
          nm --version
          size --version
          readelf --version
      - name: Build float32 oracles for Cortex-M4F and M7
        run: uv run --frozen --extra toolchain pytest -q -s tests/codegen/test_embedded.py --basetemp=embedded-build
      - name: Record flash and RAM
        run: find embedded-build -name report.txt -exec cat {} + >> "$GITHUB_STEP_SUMMARY"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Install docs dependencies
        run: uv sync --frozen --only-group docs

      # The build emits a warning per broken internal link and per page missing from the nav.
      # Those are the failures worth catching, so the run is failed on any warning rather than
      # left green with a wall of them.
      - name: Build the documentation site
        run: |
          set -o pipefail
          uv run --frozen --only-group docs zensical build 2>&1 | tee build.log
          if grep -qE "^(Warning|Error):" build.log; then
            echo "::error::the docs build reported warnings or errors (broken links, missing pages)"
            grep -E "^(Warning|Error):" build.log | sort | uniq -c
            exit 1
          fi

  platforms:
    uses: ./.github/workflows/ci-platform.yml
    with:
      environments: '[{"platform":"linux-x86_64","runner":"ubuntu-latest"}]'

  smoke:
    uses: ./.github/workflows/ci-platform.yml
    with:
      suite: smoke
      environments: '[{"platform":"linux-x86_64","runner":"ubuntu-latest"}]'

  # A skipped required check counts as passed, so this runs whatever happened before it.
  ci:
    needs: [lint, docs, platforms, smoke]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Summarize the run
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate --jq '.jobs[]' | jq -s .)
          result() { r=$(jq -r --arg name "$1" '.[] | select(.name == $name) | .conclusion // "not finished"' <<<"$jobs"); echo "${r:-not run}"; }
          step() { r=$(jq -r --arg name "$1" --arg step "$2" '.[] | select(.name == $name) | .steps[]? | select(.name == $step) | .conclusion // "not finished"' <<<"$jobs"); echo "${r:-$(result "$1")}"; }
          {
            echo "| Platform | Native code | Install | Tests | Smoke |"
            echo "| --- | --- | --- | --- | --- |"
            for platform in linux-x86_64; do
              native=$(step "platforms / $platform" Build)
              if [ "$native" = success ]; then
                saved=$(step "platforms / $platform" "Save the native libraries")
                if [ "$saved" = success ]; then native=built; else native=cached; fi
              fi
              smoke=$(step "smoke / $platform" Test)
              echo "| $platform | $native | $(step "platforms / $platform" Install) | $(step "platforms / $platform" Test) | $smoke |"
            done
            echo
            echo "lint: $(result lint), docs: $(result docs)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::Not every job succeeded: $(echo $failed)"
            exit 1
          fi
