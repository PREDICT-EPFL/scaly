name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A plugin wheel depends only on its own directory, the cibuildwheel release (which pins the
  # manylinux image) and the platform, so a cached wheel stays valid across runner images: it
  # bundles its runtime. Artifacts are kept for the longest period the organization allows, since
  # `release.yml` publishes the files a successful run on `main` built.
  wheels:
    name: ${{ matrix.package }} wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        package: [scaly-piqp, scaly-ipopt]
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - name: Restore the wheel
        id: cache
        uses: actions/cache@v4
        with:
          path: wheelhouse
          key: wheel-${{ matrix.package }}-${{ matrix.os }}-cibuildwheel-4.2.1-${{ hashFiles(format('plugins/{0}/**', matrix.package), format('!plugins/{0}/tests/**', matrix.package)) }}

      - name: Install gfortran (macOS)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS' && matrix.package == 'scaly-ipopt'
        run: brew install gcc

      # The plugins load their solvers through ctypes, so the hooks tag every wheel
      # `py3-none-<platform>` and one interpreter builds the wheel that serves them all. The
      # IPOPT wheel bundles Homebrew's Fortran runtime, which is built for the runner's macOS,
      # so its wheel cannot claim an older deployment target than that.
      - uses: pypa/cibuildwheel@v4.2.1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          package-dir: plugins/${{ matrix.package }}
          output-dir: wheelhouse
        env:
          CIBW_BUILD: cp312-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ENVIRONMENT: SCALY_BUILD_SOLVERS=required
          CIBW_ENVIRONMENT_MACOS: >-
            SCALY_BUILD_SOLVERS=required
            ${{ matrix.package == 'scaly-ipopt' && 'MACOSX_DEPLOYMENT_TARGET=15.0' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.package }}-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 90

  pure:
    name: sdists + pure wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build
        run: |
          uv build -o dist .
          uv build -o dist plugins/scaly-sqp
          uv build -o dist --sdist plugins/scaly-piqp
          uv build -o dist --sdist plugins/scaly-ipopt

      - uses: actions/upload-artifact@v4
        with:
          name: dist-pure
          path: dist/*
          retention-days: 90

  lint-type:
    name: lint + type / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: uv sync (Python/core only)
        env:
          SCALY_BUILD_SOLVERS: skip
        run: uv sync --frozen

      - name: Native toolchain report
        run: uv run scaly_toolchain

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: ty type-check
        run: uv run ty check --error-on-warning .

      - name: Pytest node-ID baseline
        run: uv run pytest --collect-only -q

  tests-core:
    name: core tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: uv sync (Python/core only)
        env:
          SCALY_BUILD_SOLVERS: skip
        run: uv sync --frozen

      - name: C compiler report
        run: |
          cc --version
          if [ "$RUNNER_OS" = "macOS" ]; then xcodebuild -version; fi

      - name: Pytest core suite
        run: uv run pytest -n=auto -m "not solver"

      - name: Benchmark smoke
        run: uv run python benchmarks/run.py smoke --skip solver_call

  # The solver tests run against the plugin wheels, not an editable build, so they check the
  # binaries users install. `UV_NO_SYNC` keeps every `uv run` from swapping the wheels back for the
  # editable plugins; if something syncs anyway, the plugins return without their libraries and
  # `SCALY_REQUIRE_SOLVERS` fails the run instead of skipping.
  tests-solvers:
    name: solver tests / ${{ matrix.os }}
    needs: [wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    env:
      UV_NO_SYNC: "1"
      SCALY_BUILD_SOLVERS: skip
      SCALY_REQUIRE_SOLVERS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-scaly-*-${{ matrix.os }}
          merge-multiple: true
          path: dist

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install the plugin wheels
        run: |
          uv sync --frozen --no-install-package scaly-piqp --no-install-package scaly-ipopt
          uv pip install --no-deps dist/*.whl
          uv run python -c "import scaly_piqp, scaly_ipopt; assert all('site-packages' in m.__file__ for m in (scaly_piqp, scaly_ipopt))"

      - name: Native solver report
        run: uv run scaly_toolchain

      - name: Pytest solver suite
        env:
          SCALY_REQUIRE_SOLVERS: "1"
        run: uv run pytest -n=auto -m solver

      - name: Solver-call smoke
        run: uv run python benchmarks/run.py smoke --select solver_call

      - name: Solver-backed problem gates
        env:
          SCALY_REQUIRE_SOLVERS: "1"
        run: uv run python benchmarks/run.py smoke --select problems

      - name: Public closed-loop smoke commands
        run: |
          uv run python benchmarks/run.py closed-loop --problem chain --solver ipopt --oracle scaly --smoke
          uv run python benchmarks/run.py closed-loop --problem chain --solver sqp --oracle scaly --smoke
          uv run python benchmarks/run.py closed-loop --problem chain --solver sqp --oracle casadi --smoke
          uv run python benchmarks/run.py closed-loop --problem race_cars --solver ipopt --oracle scaly --smoke
          uv run python benchmarks/run.py closed-loop --problem race_cars --solver ipopt --oracle casadi --smoke
          uv run python benchmarks/run.py closed-loop --problem race_cars --solver sqp --oracle scaly --smoke
          uv run python benchmarks/run.py closed-loop --problem race_cars --solver sqp --oracle casadi --smoke
          uv run python benchmarks/run.py closed-loop --problem unbumpercars --solver ipopt --oracle scaly --smoke
          uv run python benchmarks/run.py closed-loop --problem unbumpercars --solver ipopt --oracle casadi --smoke
          uv run python benchmarks/run.py closed-loop --problem unbumpercars --solver sqp --oracle scaly --smoke
          uv run python benchmarks/run.py closed-loop --problem unbumpercars --solver sqp --oracle casadi --smoke
          uv run python benchmarks/run.py closed-loop --problem unbumpercars --solver none --smoke

      - name: Repeated benchmark commands
        run: |
          uv run benchmarks/run.py sweep --workloads race_cars --sizes 1 --backends scaly,casadi_map_sx --repetitions 2 --benchmark-min-time 0.01s --out benchmarks/results/smoke/repeated/sweep.csv
          uv run benchmarks/run.py closed-loop --problem race_cars --solver ipopt --oracle scaly,casadi --smoke --repetitions 2 --out-dir benchmarks/results/smoke/repeated/episodes
          uv run benchmarks/run.py closed-loop --problem race_cars --solver ipopt --oracle casadi --casadi-interpreted --smoke --repetitions 2 --out-dir benchmarks/results/smoke/repeated/episodes
          uv run benchmarks/run.py modes benchmarks/results/smoke/repeated/episodes --out benchmarks/results/smoke/repeated/modes.csv

  install:
    name: install / ${{ matrix.os }}${{ matrix.container && format(' / {0}', matrix.container) || '' }}
    needs: [pure, wheels]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Slim images carry no Fortran runtime, so these prove the IPOPT wheel brings its own.
          - { os: ubuntu-latest, container: "python:3.12-slim" }
          - { os: ubuntu-latest, container: "python:3.14-slim" }
          - { os: ubuntu-24.04-arm, container: "python:3.13-slim" }
          - { os: macos-15, python: "3.13" }
          - { os: macos-15-intel, python: "3.12" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist-pure
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*-${{ matrix.os }}
          merge-multiple: true
          path: dist

      - name: Install a C compiler for the JIT (Linux)
        if: matrix.container
        run: apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev

      - uses: astral-sh/setup-uv@v6
        if: ${{ !matrix.container }}

      - name: Install the wheels
        env:
          PY: ${{ matrix.python }}
        run: |
          if [ -n "$PY" ]; then uv venv --seed -p "$PY" /tmp/env; else python -m venv /tmp/env; fi
          /tmp/env/bin/pip install --only-binary :all: dist/*.whl

      - name: Solve with every backend
        run: /tmp/env/bin/python .github/scripts/solve_smoke.py
