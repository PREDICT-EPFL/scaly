name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    uses: ./.github/workflows/wheels.yml

  pure:
    uses: ./.github/workflows/pure.yml

  lint-type:
    name: lint + type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: uv sync (Python/core only)
        env:
          SCALY_BUILD_SOLVERS: skip
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: ty type-check
        run: uv run ty check --error-on-warning .

      - name: Pytest node-ID baseline
        run: uv run pytest --collect-only -q

  tests:
    needs: [pure, wheels]
    uses: ./.github/workflows/tests.yml

  install:
    name: install / ${{ matrix.os }}${{ matrix.container && format(' / {0}', matrix.container) || '' }}
    needs: [pure, wheels]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Slim images carry no Fortran runtime, so these prove the IPOPT wheel brings its own.
          - { os: ubuntu-latest, container: "python:3.14-slim" }
          - { os: ubuntu-24.04-arm, container: "python:3.14-slim" }
          - { os: macos-15, python: "3.14" }
          - { os: macos-15-intel, python: "3.14" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist-pure
          path: dist

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*-${{ matrix.os }}
          merge-multiple: true
          path: dist

      - name: Install C development files and the solver runtime (Linux)
        if: matrix.container
        run: apt-get update && apt-get install -y --no-install-recommends libc6-dev libstdc++6

      - uses: astral-sh/setup-uv@v10.2.0
        if: ${{ !matrix.container }}

      - name: Install the wheels
        env:
          PY: ${{ matrix.python }}
        run: |
          if [ -n "$PY" ]; then uv venv --seed -p "$PY" /tmp/env; else python -m venv /tmp/env; fi
          /tmp/env/bin/pip install --only-binary :all: "$(echo dist/scaly-[0-9]*.whl)[toolchain]" dist/*.whl

      - name: Solve with every backend through zig cc
        run: |
          /tmp/env/bin/scaly_toolchain | grep -E '\((zig-bin|ziglang)\)'
          /tmp/env/bin/python .github/scripts/solve_smoke.py
