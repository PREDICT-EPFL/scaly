name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendored-solvers:
    name: vendored solvers / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # A cached build must not outlive the toolchain it was linked against, so the runner
      # image identity joins the key.
      - name: Toolchain identity
        id: toolchain
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      # Beyond that the key depends only on the native build recipe. GitHub Actions
      # automatically falls back to caches from the default branch, so feature branches reuse
      # main's validated solver build when the plugin hatch hooks are unchanged.
      - name: Restore third_party + built libs
        id: cache-vendored
        uses: actions/cache/restore@v4
        with:
          path: |
            plugins/scaly-piqp/third_party
            plugins/scaly-piqp/src/scaly_piqp/lib
            plugins/scaly-piqp/src/scaly_piqp/include
            plugins/scaly-piqp/src/scaly_piqp/licenses
            plugins/scaly-ipopt/third_party
            plugins/scaly-ipopt/src/scaly_ipopt/lib
            plugins/scaly-ipopt/src/scaly_ipopt/include
            plugins/scaly-ipopt/src/scaly_ipopt/licenses
          key: ${{ runner.os }}-${{ runner.arch }}-vendored-${{ steps.toolchain.outputs.id }}-${{ hashFiles('plugins/scaly-piqp/hatch_build.py', 'plugins/scaly-ipopt/hatch_build.py', 'plugins/*/src/*/build_config.json') }}

      - name: Report cache state
        run: |
          echo "cache-hit=${{ steps.cache-vendored.outputs.cache-hit }}"
          echo "cache-primary-key=${{ steps.cache-vendored.outputs.cache-primary-key }}"
          ls -lh plugins/scaly-piqp/src/scaly_piqp/lib plugins/scaly-ipopt/src/scaly_ipopt/lib 2>/dev/null || echo "plugin libs not present — will cold-build"

      - name: Install system toolchain (Linux)
        if: runner.os == 'Linux' && steps.cache-vendored.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake build-essential

      - name: Install system toolchain (macOS)
        if: runner.os == 'macOS' && steps.cache-vendored.outputs.cache-hit != 'true'
        run: |
          brew install gcc cmake

      - uses: astral-sh/setup-uv@v6
        if: steps.cache-vendored.outputs.cache-hit != 'true'
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.cache-vendored.outputs.cache-hit != 'true'
        run: uv python install

      - name: uv sync (builds PIQP + IPOPT on cache miss)
        if: steps.cache-vendored.outputs.cache-hit != 'true'
        env:
          SCALY_BUILD_SOLVERS: required
        run: uv sync --frozen

      - name: Save third_party + built libs
        if: steps.cache-vendored.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            plugins/scaly-piqp/third_party
            plugins/scaly-piqp/src/scaly_piqp/lib
            plugins/scaly-piqp/src/scaly_piqp/include
            plugins/scaly-piqp/src/scaly_piqp/licenses
            plugins/scaly-ipopt/third_party
            plugins/scaly-ipopt/src/scaly_ipopt/lib
            plugins/scaly-ipopt/src/scaly_ipopt/include
            plugins/scaly-ipopt/src/scaly_ipopt/licenses
          key: ${{ steps.cache-vendored.outputs.cache-primary-key }}

      - name: Inspect vendored libs
        run: |
          ls -lh plugins/scaly-piqp/src/scaly_piqp/lib plugins/scaly-ipopt/src/scaly_ipopt/lib
          if [ "$RUNNER_OS" = "macOS" ]; then otool -L plugins/scaly-ipopt/src/scaly_ipopt/lib/libipopt.dylib; fi
          if [ "$RUNNER_OS" = "Linux" ]; then ldd plugins/scaly-ipopt/src/scaly_ipopt/lib/libipopt.so; fi

      # Only the built libraries, their headers and the generated notices — `third_party` is build
      # scratch the consumer never reads, since the hooks skip once lib, header and notices are present. Every
      # path here sits under `plugins/`, so that is the artifact root and `solver tests`
      # must download with `path: plugins` to land them back where the hooks look.
      - name: Upload vendored solver artifact for this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: vendored-solvers-${{ runner.os }}-${{ runner.arch }}
          path: |
            plugins/scaly-piqp/src/scaly_piqp/lib
            plugins/scaly-piqp/src/scaly_piqp/include
            plugins/scaly-piqp/src/scaly_piqp/licenses
            plugins/scaly-ipopt/src/scaly_ipopt/lib
            plugins/scaly-ipopt/src/scaly_ipopt/include
            plugins/scaly-ipopt/src/scaly_ipopt/licenses
          retention-days: 3

  lint-type:
    name: lint + type / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: uv sync (Python/core only)
        env:
          SCALY_BUILD_SOLVERS: skip
        run: uv sync --frozen

      - name: Native toolchain report
        run: uv run python -m scaly.codegen.toolchain

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: ty type-check
        run: uv run ty check --error-on-warning .

      - name: Pytest node-ID baseline
        run: uv run pytest --collect-only -q

  tests-core:
    name: core tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: uv sync (Python/core only)
        env:
          SCALY_BUILD_SOLVERS: skip
        run: uv sync --frozen

      - name: C compiler report
        run: |
          cc --version
          if [ "$RUNNER_OS" = "macOS" ]; then xcodebuild -version; fi

      - name: Pytest core suite
        run: uv run pytest -n=auto -m "not solver"

      - name: Benchmark smoke
        run: uv run python benchmarks/run.py smoke --skip solver_call

  tests-solvers:
    name: solver tests / ${{ matrix.os }}
    needs: [vendored-solvers]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Download vendored solver artifact
        uses: actions/download-artifact@v4
        with:
          name: vendored-solvers-${{ runner.os }}-${{ runner.arch }}
          path: plugins

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: uv sync (uses restored vendored solvers)
        env:
          SCALY_BUILD_SOLVERS: required
        run: uv sync --frozen

      - name: Native solver report
        run: uv run python -m scaly.codegen.toolchain

      - name: Inspect vendored libs
        run: |
          ls -lh plugins/scaly-piqp/src/scaly_piqp/lib plugins/scaly-ipopt/src/scaly_ipopt/lib
          if [ "$RUNNER_OS" = "macOS" ]; then otool -L plugins/scaly-ipopt/src/scaly_ipopt/lib/libipopt.dylib; fi
          if [ "$RUNNER_OS" = "Linux" ]; then ldd plugins/scaly-ipopt/src/scaly_ipopt/lib/libipopt.so; fi

      - name: Pytest solver suite
        env:
          SCALY_REQUIRE_SOLVERS: "1"
        run: uv run pytest -n=auto -m solver

      - name: Solver-call smoke
        run: uv run python benchmarks/run.py smoke --select solver_call

      - name: Solver-backed problem gates
        env:
          SCALY_REQUIRE_SOLVERS: "1"
        run: uv run python benchmarks/run.py smoke --select problems

      - name: Public closed-loop smoke commands
        run: |
          uv run python benchmarks/run.py closed-loop --problem chain --solver ipopt --oracle scaly --smoke
          uv run python benchmarks/run.py closed-loop --problem chain --solver sqp --oracle scaly --smoke
          uv run python benchmarks/run.py closed-loop --problem chain --solver sqp --oracle casadi --smoke
          uv run python benchmarks/run.py closed-loop --problem race_cars --solver ipopt --oracle scaly --smoke
          uv run python benchmarks/run.py closed-loop --problem race_cars --solver ipopt --oracle casadi --smoke
          uv run python benchmarks/run.py closed-loop --problem race_cars --solver sqp --oracle scaly --smoke
          uv run python benchmarks/run.py closed-loop --problem race_cars --solver sqp --oracle casadi --smoke
          uv run python benchmarks/run.py closed-loop --problem unbumpercars --solver ipopt --oracle scaly --smoke
          uv run python benchmarks/run.py closed-loop --problem unbumpercars --solver ipopt --oracle casadi --smoke
          uv run python benchmarks/run.py closed-loop --problem unbumpercars --solver sqp --oracle scaly --smoke
          uv run python benchmarks/run.py closed-loop --problem unbumpercars --solver sqp --oracle casadi --smoke
          uv run python benchmarks/run.py closed-loop --problem unbumpercars --solver none --smoke

      - name: Repeated benchmark commands
        run: |
          uv run benchmarks/run.py sweep --workloads race_cars --sizes 1 --backends scaly,casadi_map_sx --repetitions 2 --benchmark-min-time 0.01s --out benchmarks/results/smoke/repeated/sweep.csv
          uv run benchmarks/run.py closed-loop --problem race_cars --solver ipopt --oracle both --smoke --repetitions 2 --out-dir benchmarks/results/smoke/repeated/episodes
          uv run benchmarks/run.py closed-loop --problem race_cars --solver ipopt --oracle casadi --casadi-interpreted --smoke --repetitions 2 --out-dir benchmarks/results/smoke/repeated/episodes
          uv run benchmarks/run.py modes benchmarks/results/smoke/repeated/episodes --out benchmarks/results/smoke/repeated/modes.csv
