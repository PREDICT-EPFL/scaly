name: CI

on:
  push:
    branches: [main, toolchain]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendored-solvers:
    name: vendored solvers / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # A cached build must not outlive the toolchain it was linked against, so the runner
      # image identity joins the key.
      - name: Toolchain identity
        id: toolchain
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      # Beyond that the key depends only on the native build recipe. GitHub Actions
      # automatically falls back to caches from the default branch, so feature branches reuse
      # main's validated solver build when the plugin hatch hooks are unchanged.
      - name: Restore third_party + built libs
        id: cache-vendored
        uses: actions/cache/restore@v4
        with:
          path: |
            plugins/alloy-piqp/third_party
            plugins/alloy-piqp/src/alloy_piqp/lib
            plugins/alloy-piqp/src/alloy_piqp/include
            plugins/alloy-ipopt/third_party
            plugins/alloy-ipopt/src/alloy_ipopt/lib
            plugins/alloy-ipopt/src/alloy_ipopt/include
          key: ${{ runner.os }}-${{ runner.arch }}-vendored-${{ steps.toolchain.outputs.id }}-${{ hashFiles('plugins/alloy-piqp/hatch_build.py', 'plugins/alloy-ipopt/hatch_build.py') }}

      - name: Report cache state
        run: |
          echo "cache-hit=${{ steps.cache-vendored.outputs.cache-hit }}"
          echo "cache-primary-key=${{ steps.cache-vendored.outputs.cache-primary-key }}"
          ls -lh plugins/alloy-piqp/src/alloy_piqp/lib plugins/alloy-ipopt/src/alloy_ipopt/lib 2>/dev/null || echo "plugin libs not present — will cold-build"

      - name: Install system toolchain (Linux)
        if: runner.os == 'Linux' && steps.cache-vendored.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake build-essential

      - name: Install system toolchain (macOS)
        if: runner.os == 'macOS' && steps.cache-vendored.outputs.cache-hit != 'true'
        run: |
          brew install gcc cmake

      - uses: astral-sh/setup-uv@v6
        if: steps.cache-vendored.outputs.cache-hit != 'true'
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.cache-vendored.outputs.cache-hit != 'true'
        run: uv python install

      - name: uv sync (builds PIQP + IPOPT on cache miss)
        if: steps.cache-vendored.outputs.cache-hit != 'true'
        env:
          ALLOY_BUILD_SOLVERS: required
        run: uv sync --frozen

      - name: Save third_party + built libs
        if: steps.cache-vendored.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            plugins/alloy-piqp/third_party
            plugins/alloy-piqp/src/alloy_piqp/lib
            plugins/alloy-piqp/src/alloy_piqp/include
            plugins/alloy-ipopt/third_party
            plugins/alloy-ipopt/src/alloy_ipopt/lib
            plugins/alloy-ipopt/src/alloy_ipopt/include
          key: ${{ steps.cache-vendored.outputs.cache-primary-key }}

      - name: Inspect vendored libs
        run: |
          ls -lh plugins/alloy-piqp/src/alloy_piqp/lib plugins/alloy-ipopt/src/alloy_ipopt/lib
          if [ "$RUNNER_OS" = "macOS" ]; then otool -L plugins/alloy-ipopt/src/alloy_ipopt/lib/libipopt.dylib; fi
          if [ "$RUNNER_OS" = "Linux" ]; then ldd plugins/alloy-ipopt/src/alloy_ipopt/lib/libipopt.so; fi

      # Only the built libraries and their headers — `third_party` is build scratch the
      # consumer never reads, since the hooks skip once lib+header are present. Every
      # path here sits under `plugins/`, so that is the artifact root and `solver tests`
      # must download with `path: plugins` to land them back where the hooks look.
      - name: Upload vendored solver artifact for this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: vendored-solvers-${{ runner.os }}-${{ runner.arch }}
          path: |
            plugins/alloy-piqp/src/alloy_piqp/lib
            plugins/alloy-piqp/src/alloy_piqp/include
            plugins/alloy-ipopt/src/alloy_ipopt/lib
            plugins/alloy-ipopt/src/alloy_ipopt/include
          retention-days: 3

  lint-type:
    name: lint + type / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: uv sync (Python/core only)
        env:
          ALLOY_BUILD_SOLVERS: skip
        run: uv sync --frozen

      - name: Native toolchain report
        run: uv run python -m alloy.codegen.toolchain

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: ty type-check
        run: uv run ty check .

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --only-group docs

      # The build emits a warning per broken internal link and per page missing from the nav.
      # Those are the failures worth catching, so the run is failed on any warning rather than
      # left green with a wall of them.
      - name: Build the documentation site
        run: |
          set -o pipefail
          uv run --only-group docs zensical build 2>&1 | tee build.log
          if grep -qE "^(Warning|Error):" build.log; then
            echo "::error::the docs build reported warnings or errors (broken links, missing pages)"
            grep -E "^(Warning|Error):" build.log | sort | uniq -c
            exit 1
          fi

  tests-core:
    name: core tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: uv sync (Python/core only)
        env:
          ALLOY_BUILD_SOLVERS: skip
        run: uv sync --frozen

      - name: C compiler report
        run: |
          cc --version
          if [ "$RUNNER_OS" = "macOS" ]; then xcodebuild -version; fi

      - name: Pytest core suite
        run: uv run pytest -n=auto -m "not solver"

      - name: Benchmark smoke
        run: uv run python benchmarks/run.py smoke --skip solver_call

  tests-solvers:
    name: solver tests / ${{ matrix.os }}
    needs: [vendored-solvers]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Download vendored solver artifact
        uses: actions/download-artifact@v4
        with:
          name: vendored-solvers-${{ runner.os }}-${{ runner.arch }}
          path: plugins

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: uv sync (uses restored vendored solvers)
        env:
          ALLOY_BUILD_SOLVERS: required
        run: uv sync --frozen

      - name: Native solver report
        run: uv run python -m alloy.codegen.toolchain

      - name: Inspect vendored libs
        run: |
          ls -lh plugins/alloy-piqp/src/alloy_piqp/lib plugins/alloy-ipopt/src/alloy_ipopt/lib
          if [ "$RUNNER_OS" = "macOS" ]; then otool -L plugins/alloy-ipopt/src/alloy_ipopt/lib/libipopt.dylib; fi
          if [ "$RUNNER_OS" = "Linux" ]; then ldd plugins/alloy-ipopt/src/alloy_ipopt/lib/libipopt.so; fi

      - name: Pytest solver suite
        env:
          ALLOY_REQUIRE_SOLVERS: "1"
        run: uv run pytest -n=auto -m solver

      - name: Solver-call smoke
        run: uv run python benchmarks/run.py smoke --select solver_call

      - name: Solver-backed problem gates
        env:
          ALLOY_REQUIRE_SOLVERS: "1"
        run: uv run python benchmarks/run.py smoke --select problems

      - name: Public closed-loop smoke commands
        run: |
          uv run python benchmarks/run.py closed-loop --problem chain --solver ipopt --oracle alloy --smoke
          uv run python benchmarks/run.py closed-loop --problem chain --solver sqp --oracle alloy --smoke
          uv run python benchmarks/run.py closed-loop --problem chain --solver sqp --oracle casadi --smoke
          uv run python benchmarks/run.py closed-loop --problem race_cars --solver ipopt --oracle alloy --smoke
          uv run python benchmarks/run.py closed-loop --problem race_cars --solver ipopt --oracle casadi --smoke
          uv run python benchmarks/run.py closed-loop --problem race_cars --solver sqp --oracle alloy --smoke
          uv run python benchmarks/run.py closed-loop --problem race_cars --solver sqp --oracle casadi --smoke
          uv run python benchmarks/run.py closed-loop --problem unbumpercars --solver ipopt --oracle alloy --smoke
          uv run python benchmarks/run.py closed-loop --problem unbumpercars --solver ipopt --oracle casadi --smoke
          uv run python benchmarks/run.py closed-loop --problem unbumpercars --solver sqp --oracle alloy --smoke
          uv run python benchmarks/run.py closed-loop --problem unbumpercars --solver sqp --oracle casadi --smoke
          uv run python benchmarks/run.py closed-loop --problem unbumpercars --solver none --smoke
