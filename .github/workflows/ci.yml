name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install system toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake build-essential

      - name: Install system toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc cmake

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # The hatch hook short-circuits each builder if its install marker already exists, so a
      # restored cache turns `uv sync` into a near-instant no-op (~30s vs ~8 min cold).
      # Keyed strictly on hatch_build.py — no restore-keys, because a stale fallback would
      # silently use libs that don't match the current recipe.
      - name: Cache third_party + built libs
        id: cache-vendored
        uses: actions/cache@v4
        with:
          path: |
            third_party
            src/alloy/lib
            src/alloy/include
          key: ${{ runner.os }}-vendored-${{ hashFiles('hatch_build.py') }}

      - name: Report cache state
        run: |
          echo "cache-hit=${{ steps.cache-vendored.outputs.cache-hit }}"
          ls -lh src/alloy/lib 2>/dev/null || echo "src/alloy/lib not present — will cold-build"

      - name: uv sync (builds PIQP + IPOPT on cache miss)
        run: uv sync

      - name: Inspect vendored libs
        run: |
          ls -lh src/alloy/lib
          if [ "$RUNNER_OS" = "macOS" ]; then otool -L src/alloy/lib/libipopt.dylib; fi
          if [ "$RUNNER_OS" = "Linux" ]; then ldd src/alloy/lib/libipopt.so; fi

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: ty type-check
        run: uv run ty check .

      - name: Pytest
        run: uv run pytest -n=auto tests/

      - name: Benchmark smoke (tracking, alloy backend)
        run: uv run python benchmarks/scalability_sweep.py --tracking-horizons 5 --backends alloy --workloads tracking
