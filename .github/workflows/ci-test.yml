name: CI tests

# The tests run against the plugin wheels, not an editable build, so they check the binaries users
# install. `UV_NO_SYNC` keeps every `uv run` from swapping the wheels back for the editable plugins;
# if something syncs anyway, the plugins return without their libraries and `SCALY_REQUIRE_SOLVERS`
# fails the run instead of skipping. Every check step runs even when an earlier one failed, so one
# failure never hides another.
on:
  workflow_call:
    inputs:
      suite:
        description: ci, toolchain, python or benchmarks
        type: string
        default: ci
      environments:
        description: JSON matrix with platform, runner and optional label, python, cc, cxx, toolchain and save-cache
        type: string
        default: >-
          [{"platform":"linux-x86_64","runner":"ubuntu-latest"},
           {"platform":"linux-arm64","runner":"ubuntu-24.04-arm"},
           {"platform":"macos-arm64","runner":"macos-15"},
           {"platform":"macos-x86_64","runner":"macos-15-intel"},
           {"platform":"windows-x86_64","runner":"windows-latest"}]

jobs:
  test:
    name: ${{ matrix.label || matrix.platform }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.environments) }}
    env:
      UV_NO_SYNC: "1"
      SCALY_BUILD_SOLVERS: skip
      SCALY_REQUIRE_SOLVERS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Select Python and compilers
        env:
          CACHE_DIR: ${{ runner.temp }}/scaly-jit
          PY: ${{ matrix.python }}
          MATRIX_CC: ${{ matrix.cc }}
          MATRIX_CXX: ${{ matrix.cxx }}
        run: |
          echo "SCALY_CACHE_DIR=$CACHE_DIR" >> "$GITHUB_ENV"
          if [ -n "$PY" ]; then echo "UV_PYTHON=$PY" >> "$GITHUB_ENV"; fi
          if [ -n "$MATRIX_CC" ]; then printf 'CC=%s\nCXX=%s\n' "$MATRIX_CC" "$MATRIX_CXX" >> "$GITHUB_ENV"; fi

      - name: Set up Python
        run: uv python install

      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.platform }}
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: dist-pure
          path: dist

      - name: Install test dependencies and wheels
        run: |
          flags=(--no-install-package scaly-piqp --no-install-package scaly-ipopt)
          wheels=(dist/scaly_piqp-*.whl dist/scaly_ipopt-*.whl)
          if [ "$RUNNER_OS" = Windows ]; then
            flags+=(--no-install-package scaly --no-install-package scaly-sqp)
            wheels+=(dist/scaly-[0-9]*.whl dist/scaly_sqp-*.whl)
          fi
          uv sync --frozen ${{ matrix.toolchain && runner.os != 'Windows' && '--extra toolchain' || '' }} "${flags[@]}"
          uv pip install --no-deps "${wheels[@]}"
          uv run python -c "import importlib, sys; names = ('scaly', 'scaly_ipopt', 'scaly_piqp', 'scaly_sqp') if sys.platform == 'win32' else ('scaly_piqp', 'scaly_ipopt'); assert all('site-packages' in importlib.import_module(n).__file__ for n in names)"

      - name: Native toolchain report
        run: |
          if [ "$RUNNER_OS" != Windows ]; then ${CC:-cc} --version; ${CXX:-c++} --version; fi
          if [ "$RUNNER_OS" = "macOS" ]; then xcodebuild -version; fi
          uv run python --version
          uv run scaly_toolchain
          if [ "$RUNNER_OS" = Windows ] || [ "${{ matrix.toolchain }}" = true ]; then
            uv run python -c "from scaly.codegen.toolchain import find_c_compiler; cc = find_c_compiler(); assert cc is not None and cc.source in ('zig-bin', 'ziglang'), cc"
          fi

      # zig builds its C and C++ runtimes for the host CPU on first use, which on a fresh runner takes
      # minutes, longer than the time limits of the examples and the benchmark driver tests. Its cache
      # is kept between runs, keyed on zig's version and its model and features of this CPU, since
      # the JIT compiles with -march=native and runners differ in CPU.
      - name: Locate zig's cache
        id: zig
        if: runner.os == 'Windows' && inputs.suite != 'python'
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}\zig
        run: |
          echo "ZIG_GLOBAL_CACHE_DIR=$ZIG_GLOBAL_CACHE_DIR" >> "$GITHUB_ENV"
          zig=$(uv run python -c "from scaly.codegen.toolchain import find_c_compiler; print(find_c_compiler().command[0])")
          cpu=$("$zig" build-exe --show-builtin | sed -n '/^pub const cpu/,/^};/p')
          model=$(sed -n 's/.*\.model = &std\.Target\.[a-z0-9_]*\.cpu\.\([a-zA-Z0-9_]*\),/\1/p' <<<"$cpu")
          echo "key=zig-${{ matrix.platform }}-$("$zig" version)-$model-$(sha256sum <<<"$cpu" | cut -c1-12)" | tee -a "$GITHUB_OUTPUT"

      - name: Restore zig's cache
        id: zig-cache
        if: steps.zig.outcome == 'success'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}\zig
          key: ${{ steps.zig.outputs.key }}

      # This builds both runtimes once: the JIT compiles from its cache, the driver links from a
      # temporary directory.
      - name: Warm zig's cache
        if: runner.os == 'Windows' && inputs.suite != 'python'
        run: |
          uv run python - <<'EOF'
          import subprocess, tempfile
          from pathlib import Path
          import numpy as np
          import scaly as sc
          from benchmarks.harness.gbench import compiler
          print(sc.function(sc.arg("x", 2), outputs=sc.arg("y"), name="warm")(lambda x: x.sum())(np.ones(2)))
          with tempfile.TemporaryDirectory() as tmp:
            Path(tmp, "warm.cpp").write_text("#include <string>\nint main() { return std::string(\"warm\").size() == 4 ? 0 : 1; }\n")
            subprocess.run([*compiler(), "warm.cpp", "-o", "warm.exe", "-lshlwapi"], cwd=tmp, check=True)
          EOF

      # A merge-queue cache would be visible only to its own short-lived branch.
      - name: Save zig's cache
        if: steps.zig-cache.outcome == 'success' && steps.zig-cache.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}\zig
          key: ${{ steps.zig.outputs.key }}

      - name: Restore the nightly compile cache
        if: inputs.suite == 'ci'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCALY_CACHE_DIR }}
          key: jit-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jit-${{ matrix.platform }}-

      # The compiler fingerprint gives each Google Benchmark build its own key.
      - name: Locate Google Benchmark
        id: gbench
        run: |
          uv run python -c "from benchmarks.harness.gbench import GBENCH_TAG, gbench_prefix; prefix = gbench_prefix(); print(f'path={prefix.as_posix()}'); print(f'key=gbench-${{ matrix.platform }}-{GBENCH_TAG}-{prefix.name}')" >> "$GITHUB_OUTPUT"

      - name: Restore Google Benchmark
        if: inputs.suite == 'ci'
        id: gbench-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.gbench.outputs.path }}
          key: ${{ steps.gbench.outputs.key }}

      - name: Prepare the benchmark driver
        run: uv run python -c "from benchmarks.harness.gbench import gbench_flags; gbench_flags()"

      - name: Save Google Benchmark
        if: (inputs.suite == 'ci' || matrix.save-cache) && steps.gbench-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gbench.outputs.path }}
          key: ${{ steps.gbench.outputs.key }}

      - name: Pytest
        if: inputs.suite != 'benchmarks'
        run: uv run pytest -n=auto

      - name: Benchmark smoke
        if: ${{ !cancelled() && (inputs.suite == 'toolchain' || inputs.suite == 'benchmarks' || (inputs.suite == 'ci' && matrix.platform == 'linux-x86_64')) }}
        run: uv run benchmarks/run.py smoke ${{ inputs.suite == 'benchmarks' && '--full' || '' }}

      - name: Closed-loop smoke
        if: ${{ !cancelled() && inputs.suite == 'ci' && matrix.platform == 'linux-x86_64' }}
        run: |
          uv run benchmarks/run.py closed-loop --smoke --problem chain --solver ipopt --oracle scaly
          uv run benchmarks/run.py closed-loop --smoke --problem race_cars --solver sqp --oracle scaly
          uv run benchmarks/run.py closed-loop --smoke --problem race_cars --solver ipopt --oracle casadi
          uv run benchmarks/run.py closed-loop --smoke --problem unbumpercars --solver ipopt --oracle scaly
          uv run benchmarks/run.py closed-loop --smoke --problem npmpc --solver ipopt --oracle scaly

      - name: Closed-loop smoke, every pair
        if: ${{ !cancelled() && inputs.suite == 'benchmarks' }}
        run: |
          uv run benchmarks/run.py closed-loop --smoke --problem chain --solver ipopt --oracle scaly
          uv run benchmarks/run.py closed-loop --smoke --problem chain --solver sqp --oracle scaly,casadi
          uv run benchmarks/run.py closed-loop --smoke --problem race_cars,unbumpercars,npmpc --solver ipopt,sqp --oracle scaly,casadi
          uv run benchmarks/run.py closed-loop --smoke --problem unbumpercars --solver none

      - name: Repeated benchmark commands
        if: ${{ !cancelled() && inputs.suite == 'benchmarks' }}
        run: |
          uv run benchmarks/run.py sweep --workloads race_cars --sizes 1 --backends scaly,casadi_map_sx --repetitions 2 --benchmark-min-time 0.01s --out benchmarks/results/smoke/repeated/sweep.csv
          uv run benchmarks/run.py closed-loop --problem race_cars --solver ipopt --oracle scaly,casadi --smoke --repetitions 2 --out-dir benchmarks/results/smoke/repeated/episodes
          uv run benchmarks/run.py closed-loop --problem race_cars --solver ipopt --oracle casadi --casadi-interpreted --smoke --repetitions 2 --out-dir benchmarks/results/smoke/repeated/episodes
          uv run benchmarks/run.py modes benchmarks/results/smoke/repeated/episodes --out benchmarks/results/smoke/repeated/modes.csv

      - name: Save the nightly compile cache
        if: success() && matrix.save-cache
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SCALY_CACHE_DIR }}
          key: jit-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
