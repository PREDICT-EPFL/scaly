name: CI tests

on:
  workflow_call:
    inputs:
      suite:
        description: ci, smoke, toolchain, python or benchmarks
        type: string
        default: ci
      include-slow:
        description: Include tests marked slow
        type: boolean
        default: false
      environments:
        description: JSON matrix with platform, runner and optional label, python, cc, cxx, toolchain and save-cache
        type: string
        default: >-
          [{"platform":"linux-x86_64","runner":"ubuntu-latest"},
           {"platform":"linux-arm64","runner":"ubuntu-24.04-arm"},
           {"platform":"macos-arm64","runner":"macos-15"},
           {"platform":"windows-x86_64","runner":"windows-latest"}]

jobs:
  test:
    name: ${{ matrix.label || matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.environments) }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'merge_group' && (inputs.suite == 'ci' || matrix.save-cache) }}
          prune-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ matrix.platform }}

      - name: Test
        uses: ./.github/actions/test
        with:
          platform: ${{ matrix.platform }}
          suite: ${{ inputs.suite }}
          include-slow: ${{ inputs.include-slow }}
          python: ${{ matrix.python }}
          cc: ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          toolchain: ${{ matrix.toolchain || false }}
          save-cache: ${{ matrix.save-cache || false }}
