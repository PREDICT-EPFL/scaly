name: CI builds

# Builds every distribution once per platform for the test jobs. The files are kept for the
# longest period the organization allows. Nightly and release runs use this build.
on:
  workflow_call:
    inputs:
      rebuild-native:
        description: ignore the native cache and rebuild the solver libraries from source
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-latest }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: windows-x86_64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          prune-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ matrix.platform }}

      - name: Set up Python
        run: uv python install

      - name: Build
        id: build
        uses: ./.github/actions/build
        with:
          platform: ${{ matrix.platform }}
          rebuild-native: ${{ inputs.rebuild-native }}

      - name: Save the native libraries
        if: steps.build.outputs.built == 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/scaly/solvers
          key: native-${{ matrix.platform }}-${{ hashFiles('plugins/*/native_build.py', 'plugins/*/src/*/build_config.json', 'plugins/*/licenses/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist/*.whl
            !dist/*-none-any.whl
          retention-days: 90

      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'linux-x86_64'
        with:
          name: dist-pure
          path: |
            dist/*-none-any.whl
            dist/*.tar.gz
          retention-days: 90
