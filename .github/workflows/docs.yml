name: Docs

# Deploys the development docs. `ci.yml` builds them on every pull request.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Install docs dependencies
        run: uv sync --frozen --only-group docs

      # Every build here goes to Cloudflare, so each one carries the banner naming its branch and
      # commit. The released site on GitHub Pages is built without it.
      - name: Mark the build as development docs
        run: printf '\n[project.extra.preview]\nbranch = "%s"\ncommit = "%s"\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" >> zensical.toml

      - name: Build the documentation site
        run: uv run --frozen --only-group docs zensical build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name="scaly-docs" --branch="${{ github.ref_name }}"
