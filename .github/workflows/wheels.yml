name: Wheels

on:
  push:
    branches: [main]
    paths: &wheel-paths
      - "pyproject.toml"
      - "src/**"
      - "plugins/**"
      - ".github/workflows/wheels.yml"
  pull_request:
    paths: *wheel-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure:
    name: sdists + pure wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build
        run: |
          uv build -o dist .
          uv build -o dist plugins/scaly-sqp
          uv build -o dist --sdist plugins/scaly-piqp
          uv build -o dist --sdist plugins/scaly-ipopt

      - uses: actions/upload-artifact@v4
        with:
          name: dist-pure
          path: dist/*

  native:
    name: ${{ matrix.package }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        package: [scaly-piqp, scaly-ipopt]
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - name: Install gfortran (macOS)
        if: runner.os == 'macOS' && matrix.package == 'scaly-ipopt'
        run: brew install gcc

      # The plugins load their solvers through ctypes, so the hooks tag every wheel
      # `py3-none-<platform>` and one interpreter builds the wheel that serves them all. The
      # IPOPT wheel bundles Homebrew's Fortran runtime, which is built for the runner's macOS,
      # so its wheel cannot claim an older deployment target than that.
      - uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: plugins/${{ matrix.package }}
          output-dir: wheelhouse
        env:
          CIBW_BUILD: cp312-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ENVIRONMENT: SCALY_BUILD_SOLVERS=required
          CIBW_ENVIRONMENT_MACOS: >-
            SCALY_BUILD_SOLVERS=required
            ${{ matrix.package == 'scaly-ipopt' && 'MACOSX_DEPLOYMENT_TARGET=15.0' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.package }}-${{ matrix.os }}
          path: wheelhouse/*.whl

  install:
    name: install / ${{ matrix.os }}${{ matrix.container && format(' / {0}', matrix.container) || '' }}
    needs: [pure, native]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Slim images carry no Fortran runtime, so these prove the IPOPT wheel brings its own.
          - { os: ubuntu-latest, container: "python:3.12-slim" }
          - { os: ubuntu-latest, container: "python:3.14-slim" }
          - { os: ubuntu-24.04-arm, container: "python:3.13-slim" }
          - { os: macos-15, python: "3.13" }
          - { os: macos-15-intel, python: "3.12" }
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Install a C compiler for the JIT (Linux)
        if: matrix.container
        run: apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev

      - uses: astral-sh/setup-uv@v6
        if: ${{ !matrix.container }}

      - name: Install the wheels
        env:
          PY: ${{ matrix.python }}
        run: |
          ls dist
          if [ -n "$PY" ]; then uv venv --seed -p "$PY" /tmp/env; else python -m venv /tmp/env; fi
          /tmp/env/bin/pip install --only-binary scaly,scaly-sqp,scaly-piqp,scaly-ipopt --find-links dist "scaly[solvers]==0.1.0a1"
          /tmp/env/bin/pip list | grep scaly

      - name: Solve with every backend
        run: |
          cd /tmp
          /tmp/env/bin/python - <<'EOF'
          import numpy as np
          import scaly as sc


          @sc.problem(vars=sc.L("x", 2), params=sc.L("target", 2))
          def tracking(x, target):
              return sc.ProblemSpec(minimize=sc.sumsqr(x - target), lb=sc.const(0.0))


          for backend in ("piqp", "ipopt", "sqp"):
              solve = sc.solver(tracking, backend)
              x, *_ = solve(np.array([-1.0, 2.0]), x0=np.ones(2))
              assert solve.stats().to_solver_status().ok, backend
              np.testing.assert_allclose(x, [0.0, 2.0], atol=1e-4)
              print(backend, "ok", x)
          EOF
