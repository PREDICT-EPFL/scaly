name: Tests

# The tests run against the plugin wheels, not an editable build, so they check the binaries users
# install. `UV_NO_SYNC` keeps every `uv run` from swapping the wheels back for the editable plugins;
# if something syncs anyway, the plugins return without their libraries and `SCALY_REQUIRE_SOLVERS`
# fails the run instead of skipping. Every check step runs even when an earlier one failed, so one
# failure never hides another.
on:
  workflow_call:
    inputs:
      environments:
        description: >-
          JSON list of {os, wheels, cc?, cxx?, python?, toolchain?}: the runner, the wheel build it
          installs, and optionally the C and C++ compilers, the Python version to test with, and
          whether to install the `toolchain` extra so the JIT compiles with `zig cc`
        type: string
        required: true
      full:
        description: run every benchmark backend and closed-loop pair instead of one of each per problem
        type: boolean
        default: false

jobs:
  tests:
    name: ${{ matrix.os }}${{ matrix.cc && format(' / {0}', matrix.cc) || '' }}${{ matrix.toolchain && ' / zig cc' || '' }}${{ matrix.python && format(' / py{0}', matrix.python) || '' }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.environments) }}
    env:
      UV_NO_SYNC: "1"
      SCALY_BUILD_SOLVERS: skip
      SCALY_REQUIRE_SOLVERS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-scaly-*-${{ matrix.wheels }}
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v8
        if: runner.os == 'Windows'
        with:
          name: dist-pure
          path: dist

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Select the Python version and compilers
        env:
          PY: ${{ matrix.python }}
          MATRIX_CC: ${{ matrix.cc }}
          MATRIX_CXX: ${{ matrix.cxx }}
        run: |
          if [ -n "$PY" ]; then echo "UV_PYTHON=$PY" >> "$GITHUB_ENV"; fi
          if [ -n "$MATRIX_CC" ]; then printf 'CC=%s\nCXX=%s\n' "$MATRIX_CC" "$MATRIX_CXX" >> "$GITHUB_ENV"; fi

      - name: Set up Python
        run: uv python install

      - name: Fresh Windows installation without the toolchain extra
        if: runner.os == 'Windows'
        run: uv run --no-project .github/scripts/windows_install.py dist "${UV_PYTHON:-$(cat .python-version)}"

      - name: Install test dependencies and wheels
        run: |
          flags=(--no-install-package scaly-ipopt)
          if [ "$RUNNER_OS" = Windows ]; then flags+=(--no-install-package scaly --no-install-package scaly-sqp); fi
          uv sync --frozen ${{ matrix.toolchain && runner.os != 'Windows' && '--extra toolchain' || '' }} --no-install-package scaly-piqp "${flags[@]}"
          uv pip install --no-deps dist/*.whl
          uv run python -c "import importlib, sys; names = ('scaly', 'scaly_ipopt', 'scaly_piqp', 'scaly_sqp') if sys.platform == 'win32' else ('scaly_piqp', 'scaly_ipopt'); assert all('site-packages' in importlib.import_module(n).__file__ for n in names)"

      - name: Windows isolated installed-wheel assertions
        if: runner.os == 'Windows'
        run: uv run .github/scripts/windows_install.py --installed

      - name: Strict Windows type check
        if: runner.os == 'Windows'
        run: uv run ty check --error-on-warning

      - name: Native toolchain report
        run: |
          if [ "$RUNNER_OS" != Windows ]; then ${CC:-cc} --version; ${CXX:-c++} --version; fi
          if [ "$RUNNER_OS" = "macOS" ]; then xcodebuild -version; fi
          uv run python --version
          uv run scaly_toolchain
          if [ "$RUNNER_OS" = Windows ] || [ "${{ matrix.toolchain }}" = true ]; then
            uv run python -c "from scaly.codegen.toolchain import find_c_compiler; cc = find_c_compiler(); assert cc is not None and cc.source in ('zig-bin', 'ziglang'), cc"
          fi

      - name: Prepare the benchmark driver
        run: uv run python -c "from benchmarks.harness.gbench import gbench_flags; gbench_flags()"

      - name: Pytest
        run: uv run pytest -n=auto

      - name: Benchmark smoke
        if: ${{ !cancelled() }}
        run: uv run benchmarks/run.py smoke ${{ inputs.full && '--full' || '' }}

      - name: Closed-loop smoke
        if: ${{ !cancelled() && !inputs.full }}
        run: |
          if [ "$RUNNER_OS" != Windows ]; then
            uv run benchmarks/run.py closed-loop --smoke --problem chain --solver ipopt --oracle scaly
          fi
          uv run benchmarks/run.py closed-loop --smoke --problem race_cars --solver sqp --oracle scaly
          uv run benchmarks/run.py closed-loop --smoke --problem race_cars --solver ipopt --oracle casadi
          uv run benchmarks/run.py closed-loop --smoke --problem unbumpercars --solver ipopt --oracle scaly
          uv run benchmarks/run.py closed-loop --smoke --problem npmpc --solver ipopt --oracle scaly

      - name: Closed-loop smoke, every pair
        if: ${{ !cancelled() && inputs.full }}
        run: |
          uv run benchmarks/run.py closed-loop --smoke --problem chain --solver ipopt --oracle scaly
          uv run benchmarks/run.py closed-loop --smoke --problem chain --solver sqp --oracle scaly,casadi
          uv run benchmarks/run.py closed-loop --smoke --problem race_cars,unbumpercars,npmpc --solver ipopt,sqp --oracle scaly,casadi
          uv run benchmarks/run.py closed-loop --smoke --problem unbumpercars --solver none

      - name: Repeated benchmark commands
        if: ${{ !cancelled() && inputs.full }}
        run: |
          uv run benchmarks/run.py sweep --workloads race_cars --sizes 1 --backends scaly,casadi_map_sx --repetitions 2 --benchmark-min-time 0.01s --out benchmarks/results/smoke/repeated/sweep.csv
          uv run benchmarks/run.py closed-loop --problem race_cars --solver ipopt --oracle scaly,casadi --smoke --repetitions 2 --out-dir benchmarks/results/smoke/repeated/episodes
          uv run benchmarks/run.py closed-loop --problem race_cars --solver ipopt --oracle casadi --casadi-interpreted --smoke --repetitions 2 --out-dir benchmarks/results/smoke/repeated/episodes
          uv run benchmarks/run.py modes benchmarks/results/smoke/repeated/episodes --out benchmarks/results/smoke/repeated/modes.csv
