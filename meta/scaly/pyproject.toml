# Generated from distributions.toml by scripts/distributions.py; edit the table and rerun it.

[project]
name = "scaly"
version = "0.1.0a1"
description = "Symbolic compiler for optimal control: typed expression graphs, sparse derivatives and standalone generated C."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["scaly-core==0.1.0a1", "scaly-numerics==0.1.0a1", "scaly-control==0.1.0a1", "scaly-tools==0.1.0a1"]
license = "BSD-2-Clause"
license-files = ["LICENSE.md"]
authors = [{ name = "Tudor Oancea", email = "tudor.oancea@epfl.ch" }]
keywords = [
  "optimal-control",
  "automatic-differentiation",
  "code-generation",
  "symbolic",
  "sparse",
  "mpc",
  "nonlinear-programming",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Compilers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/PREDICT-EPFL/scaly"
Issues = "https://github.com/PREDICT-EPFL/scaly/issues"

[project.optional-dependencies]
experimental = ["scaly-experimental==0.1.0a1"]
piqp = ["scaly-piqp>=0.1.0a1,<0.2"]
ipopt = ["scaly-ipopt>=0.1.0a1,<0.2"]
sqp = ["scaly-sqp>=0.1.0a1,<0.2"]
solvers = ["scaly[piqp,ipopt,sqp]"]
all = ["scaly[experimental,solvers]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.sources]
scaly-control = { workspace = true }
scaly-core = { workspace = true }
scaly-experimental = { workspace = true }
scaly-ipopt = { workspace = true }
scaly-numerics = { workspace = true }
scaly-piqp = { workspace = true }
scaly-sqp = { workspace = true }
scaly-tools = { workspace = true }
