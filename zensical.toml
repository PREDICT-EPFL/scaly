[project]
site_name = "scaly"
site_description = "A symbolic compiler for optimal control: write models in Python, ship them as C"
repo_url = "https://github.com/PREDICT-EPFL/scaly"
repo_name = "PREDICT-EPFL/scaly"
extra_css = ["stylesheets/extra.css"]
extra_javascript = [
    "docs/javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]
# Zensical publishes everything under docs/ and has no exclusion mechanism, so the todo list and
# the frozen design notes live in internal/ at the repository root instead.
nav = [
    { "Home" = "index.md" },
    { "User guide" = [
        { "Installation" = "guide/installation.md" },
        { "Getting started" = "guide/getting_started.md" },
        { "Building functions" = "guide/functions.md" },
        { "Derivatives" = "guide/derivatives.md" },
        { "Sparsity" = "guide/sparsity.md" },
        { "Linear algebra" = "guide/linalg.md" },
        { "Nonlinear equations" = "guide/roots.md" },
        { "Integrators" = "guide/integrators.md" },
        { "Interpolation and lookup tables" = "guide/interp.md" },
        { "Optimal control" = "guide/ocp.md" },
        { "Solvers" = "guide/solvers.md" },
        { "Solver backends" = "guide/solver_backends.md" },
        { "Code generation" = "guide/codegen.md" },
        { "Options" = "guide/options.md" },
        { "Visualization" = "guide/visualization.md" },
        { "Environment variables" = "guide/env_vars.md" },
    ] },
    { "How it works" = [
        { "Architecture" = "how_it_works/architecture.md" },
        { "The intermediate representations" = "how_it_works/ir.md" },
        { "Lowering and optimization" = "how_it_works/lowering.md" },
        { "Differentiation" = "how_it_works/autodiff.md" },
        { "The generated interface" = "how_it_works/generated_interface.md" },
        { "Solvers" = "how_it_works/solvers.md" },
        { "Influences" = "how_it_works/influences.md" },
    ] },
    { "Benchmark results" = [
        { "Overview" = "results/index.md" },
        { "Scalability sweep" = "results/scalability.md" },
        { "Are the comparisons fair?" = "results/fairness.md" },
    ] },
    { "Developer guide" = [
        { "Contributing" = "dev/contributing.md" },
        { "Conventions" = "dev/conventions.md" },
        { "The codebase" = "dev/codebase.md" },
        { "Solver plugins" = "dev/solver_plugins.md" },
        { "Versioning" = "dev/versioning.md" },
        { "Fuzzing" = "dev/fuzzing.md" },
    ] },
    { "API reference" = [
        { "Overview" = "api/index.md" },
        { "Core" = "api/core.md" },
        { "Building functions" = "api/functions.md" },
        { "Differentiation" = "api/ad.md" },
        { "Code generation" = "api/codegen.md" },
        { "Export" = "api/export.md" },
        { "Extensions" = "api/ext.md" },
        { "Nonlinear equations" = "api/roots.md" },
        { "Integrators" = "api/integrators.md" },
        { "Interpolation" = "api/interp.md" },
        { "Optimal control" = "api/ocp.md" },
        { "Sets" = "api/sets.md" },
        { "Neural networks" = "api/nn.md" },
        { "Geometry" = "api/geometry.md" },
        { "Solvers" = "api/solvers.md" },
        { "Visualization" = "api/viz.md" },
        { "Testing" = "api/testing.md" },
    ] },
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme]
features = [
    "content.code.copy",
    "content.code.annotate",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.instant",
    "search.highlight",
    "search.suggest",
    "toc.follow",
]
logo = "assets/scaly-wordmark.svg"
favicon = "assets/scaly-mark.svg"


[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = true
show_root_heading = true
show_root_full_path = false
show_signature_annotations = true
separate_signature = true
members_order = "source"
filters = ["!^_"]

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
