[project]
name = "alloy-piqp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["alloy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.entry-points."alloy.solvers"]
piqp = "alloy_piqp:BACKEND"

[tool.hatch.build.targets.wheel]
packages = ["src/alloy_piqp"]
artifacts = [
  "src/alloy_piqp/lib/*",
  "src/alloy_piqp/include/**/*",
]

[tool.hatch.build.targets.sdist]
include = ["src/", "hatch_build.py"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv.sources]
alloy = { workspace = true }
