[project]
name = "scaly-piqp"
version = "0.1.0a1"
description = "PIQP backend for scaly: the vendored solver plus the qp() oracle bindings."
requires-python = ">=3.12"
dependencies = ["scaly-numerics>=0.1.0a1,<0.2"]
license = "BSD-2-Clause"
license-files = ["LICENSE.md"]

[build-system]
requires = ["hatchling", "cmake>=3.5"]
build-backend = "hatchling.build"

[project.entry-points."scaly.methods"]
"opt.piqp" = "scaly_piqp:PIQP"

[tool.hatch.build.targets.wheel]
packages = ["src/scaly_piqp"]
artifacts = [
  "src/scaly_piqp/_piqp_ext*.so",
  "src/scaly_piqp/_piqp_ext.pyi",
  "src/scaly_piqp/lib/*",
  "src/scaly_piqp/include/**/*",
  "src/scaly_piqp/licenses/**/*",
]

[tool.hatch.build.targets.sdist]
include = ["src/", "bindings/", "hatch_build.py", "licenses/"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv.sources]
scaly-numerics = { workspace = true }
