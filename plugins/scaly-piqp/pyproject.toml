[project]
name = "scaly-piqp"
version = "0.1.0a1"
description = "PIQP backend for scaly: the vendored solver plus the qp() oracle bindings."
requires-python = ">=3.12"
dependencies = ["scaly>=0.1.0a1,<0.2"]
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE.md"]

[build-system]
requires = ["hatchling", "cmake>=3.5"]
build-backend = "hatchling.build"

[project.entry-points."scaly.solvers"]
piqp = "scaly_piqp:BACKEND"

[tool.hatch.build.targets.wheel]
packages = ["src/scaly_piqp"]
artifacts = [
  "src/scaly_piqp/_piqp_ext*.so",
  "src/scaly_piqp/_piqp_ext.pyi",
  "src/scaly_piqp/lib/*",
  "src/scaly_piqp/include/**/*",
  "src/scaly_piqp/licenses/**/*",
]

[tool.hatch.build.targets.sdist]
# Anchored, and the build outputs excluded by name: hatchling matches `src/` at any depth and
# reads the repository `.gitignore` relative to this directory, where its plugin rules never match.
include = ["/src/", "/hatch_build.py", "/licenses/"]
exclude = ["/src/*/lib/", "/src/*/include/", "/src/*/licenses/"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
# Rerun the build hook when what it builds changes; it restores the build from the shared cache when it can.
cache-keys = [{ file = "pyproject.toml" }, { file = "hatch_build.py" }, { file = "src/scaly_piqp/build_config.json" }]

[tool.uv.sources]
scaly = { workspace = true }
