[project]
name = "scaly-fatrop"
version = "0.1.0"
description = "Fatrop backend for stage-structured nonlinear programs in Scaly."
requires-python = ">=3.12"
dependencies = ["scaly>=0.1.0,<0.2"]
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE.md"]
classifiers = ["Operating System :: MacOS", "Operating System :: POSIX :: Linux", "Operating System :: Microsoft :: Windows"]

[project.entry-points."scaly.solvers"]
fatrop = "scaly_fatrop:BACKEND"

[build-system]
requires = ["hatchling", "cmake>=3.21", "ninja>=1.11; sys_platform == 'win32'", "zig-bin==0.17.*; sys_platform == 'win32'"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scaly_fatrop"]
artifacts = ["src/scaly_fatrop/lib/*", "src/scaly_fatrop/include/**/*", "src/scaly_fatrop/licenses/**/*"]

[tool.hatch.build.targets.sdist]
include = ["/src/", "/hatch_build.py", "/native_build.py"]
exclude = ["/src/*/lib/", "/src/*/include/", "/src/*/licenses/", "/src/*/native-inputs.sha256"]

[tool.hatch.build.targets.sdist.force-include]
"../solver_build.py" = "solver_build.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "hatch_build.py" }, { file = "native_build.py" }, { file = "../solver_build.py" }, { file = "src/scaly_fatrop/build_config.json" }]

[tool.uv.sources]
scaly = { workspace = true }
