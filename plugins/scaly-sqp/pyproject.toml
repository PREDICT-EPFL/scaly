[project]
name = "scaly-sqp"
version = "0.1.0a1"
description = "SQP solver for scaly, generated in C on top of scaly-piqp."
requires-python = ">=3.12"
dependencies = ["scaly>=0.1.0a1,<0.2", "scaly-piqp>=0.1.0a1,<0.2", "jinja2>=3.1.6"]
license = "BSD-2-Clause"
license-files = ["LICENSE.md"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.entry-points."scaly.methods"]
"opt.sqp" = "scaly_sqp:SQP"

[tool.hatch.build.targets.wheel]
packages = ["src/scaly_sqp"]

[tool.uv.sources]
scaly = { workspace = true }
scaly-piqp = { workspace = true }
