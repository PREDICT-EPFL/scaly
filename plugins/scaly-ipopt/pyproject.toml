[project]
name = "scaly-ipopt"
version = "0.1.0a1"
description = "IPOPT backend for scaly: the vendored solver plus the nlp() oracle bindings."
requires-python = ">=3.12"
dependencies = ["scaly>=0.1.0a1,<0.2"]
license = "BSD-2-Clause"
license-files = ["LICENSE.md"]

[build-system]
requires = ["hatchling", "cmake>=3.5"]
build-backend = "hatchling.build"

[project.entry-points."scaly.methods"]
"opt.ipopt" = "scaly_ipopt:IPOPT"

[tool.hatch.build.targets.wheel]
packages = ["src/scaly_ipopt"]
artifacts = [
  "src/scaly_ipopt/lib/*",
  "src/scaly_ipopt/include/**/*",
  "src/scaly_ipopt/licenses/**/*",
]

[tool.hatch.build.targets.sdist]
include = ["src/", "hatch_build.py", "licenses/"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv.sources]
scaly = { workspace = true }
