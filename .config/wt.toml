[post-start]
copy = "wt step copy-ignored"

[[pre-merge]]
typecheck = "uv run ty check --error-on-warning"

[[pre-merge]]
format = "uv run ruff format --check"

[[pre-merge]]
lint = "uv run ruff check"

[[pre-merge]]
unit-tests = "uv run pytest -n=auto"

[[pre-merge]]
benchmarks-smoke = "uv run benchmarks/run.py smoke"

[[pre-merge]]
docs-build = "uv run zensical build"

# Words that must not appear in the tracked tree. The pattern is read from the untracked
# `.config/private-names` (see `AGENTS.local.md`); a checkout without that file skips the check.
[[pre-merge]]
no-private-names = "pat=$(cat .config/private-names 2>/dev/null); [ -z \"$pat\" ] || ! git grep -qiE \"$pat\" -- . || { git grep -niE \"$pat\" -- .; echo 'the tracked tree contains a word listed in .config/private-names'; exit 1; }"
