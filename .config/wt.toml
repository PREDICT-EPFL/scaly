[post-start]
copy = "wt step copy-ignored"

[[pre-merge]]
typecheck = "uv run ty check"

[[pre-merge]]
format = "uv run ruff format --check"

[[pre-merge]]
lint = "uv run ruff check"

[[pre-merge]]
unit-tests = "uv run pytest -n=auto tests plugins"

[[pre-merge]]
benchmarks-smoke = "uv run benchmarks/run.py smoke"

[[pre-merge]]
docs-build = "uv run zensical build"
