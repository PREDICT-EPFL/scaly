# The root manifest is scaly-core's, and the uv workspace's. What the distribution ships and declares
# is generated from distributions.toml (the marked block); the rest configures the workspace and the
# tools, and is written here.

# BEGIN generated from distributions.toml by scripts/distributions.py; edit the table and rerun it
[project]
name = "scaly-core"
version = "0.1.0a1"
description = "The scaly compiler: typed expression graphs, sparse derivatives and standalone generated C."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.3.3", "scipy>=1.18.0"]
license = "BSD-2-Clause"
license-files = ["LICENSE.md"]
authors = [{ name = "Tudor Oancea", email = "tudor.oancea@epfl.ch" }]
keywords = [
  "optimal-control",
  "automatic-differentiation",
  "code-generation",
  "symbolic",
  "sparse",
  "mpc",
  "nonlinear-programming",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Compilers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/PREDICT-EPFL/scaly"
Issues = "https://github.com/PREDICT-EPFL/scaly/issues"

[project.scripts]
scaly_codegen = "scaly.codegen.aot:main"
scaly_toolchain = "scaly.codegen.toolchain:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.sdist]
exclude = ["*"]

[tool.hatch.build.hooks.custom]
paths = [
  "scaly/__init__.py",
  "scaly/ext.py",
  "scaly/ir",
  "scaly/function",
  "scaly/ad",
  "scaly/passes",
  "scaly/codegen",
  "scaly/utils",
]
# END generated from distributions.toml

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  # Every distribution of the workspace, so `uv sync` installs them all: editable, over one src/ tree.
  "scaly",
  "scaly-numerics",
  "scaly-control",
  "scaly-tools",
  "scaly-experimental",
  "scaly-testing",
  "scaly-ipopt",
  "scaly-piqp",
  "scaly-sqp",
  "casadi>=3.8.0",
  "hatchling>=1.27.0",
  "pytest>=8.4.2",
  "pytest-xdist>=3.8.0",
  "ruff>=0.13.3",
  "ty>=0.0.75",
  "matplotlib>=3.11.0",
  "foxglove-sdk>=0.25.3",
  "pydantic>=2.13.4",
  "scipy>=1.14",
]
docs = ["zensical>=0.0.28", "mkdocstrings-python>=2.0.3"]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.workspace]
members = ["packages/*", "plugins/*", "meta/*"]

[tool.uv.sources]
scaly = { workspace = true }
scaly-numerics = { workspace = true }
scaly-control = { workspace = true }
scaly-tools = { workspace = true }
scaly-experimental = { workspace = true }
scaly-testing = { workspace = true }
scaly-ipopt = { workspace = true }
scaly-piqp = { workspace = true }
scaly-sqp = { workspace = true }

[tool.ruff]
indent-width = 2
line-length = 150
include = [
  "src/scaly/**/*.py",
  "tests/**/*.py",
  "bench/**/*.py",
  "plugins/**/*.py",
  "packages/**/*.py",
  "scripts/**/*.py",
  "hatch_build.py",
  "conftest.py",
]
exclude = [".venv"]
lint.ignore = ["E731"]

[tool.pyright]
venv = ".venv"
venvPath = "."
typeCheckingMode = "basic"
reportPrivateImportUsage = false

[tool.ty.environment]
# A notebook imports what sits beside it (the shared plot style, a harness), as a kernel started in
# its folder does. ty resolves a script's sibling modules but not a notebook's, so the notebook
# folders go on its search path; the plot style is one file in all of them.
extra-paths = [
  "examples/integrators",
  "examples/interp",
  "examples/linalg",
  "examples/nn",
  "examples/ocp",
  "examples/opt",
  "examples/roots",
]

[tool.ty.src]
exclude = [
  "hatch_build.py",
  "third_party/**",
  "plugins/*/hatch_build.py",
  "plugins/*/third_party/**",
  ".venv/**",
  "bench/**",
  "internal/**",
  # Each case study's baseline runs in that baseline's own environment (acados, JAX, CVXPY, ...).
  "examples/case_studies/*/baseline/**",
]

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
# The experimental namespaces warn on import, as they should for a user; their tests import them on purpose.
filterwarnings = ["ignore::scaly.ExperimentalWarning"]
norecursedirs = ["third_party", ".venv"]
