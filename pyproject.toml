[project]
name = "alloy"
version = "0.1.0"
description = "A symbolic IR and code-generation framework for optimal control problems."
readme = "README.md"
authors = [
    { name = "Tudor Oancea", email = "oancea.tudor@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alloy"]
artifacts = [
    "src/alloy/lib/*",
    "src/alloy/include/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "hatch_build.py",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "casadi>=3.7.2",
    "pytest>=8.4.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.13.3",
    "ty>=0.0.2",
    "torch>=2.5.0",  # for the safety-filter neural-dynamics workload
    "google-benchmark>=1.9.5",
]
docs = [
    "zensical>=0.0.28",
    "mkdocstrings-python>=2.0.3",
]

[project.scripts]
alloy_viz = "alloy.viz.serve:main"

[tool.ruff]
indent-width = 2
line-length = 150
target-version = "py312"
include = ["src/alloy/**/*.py", "tests/**/*.py", "benchmarks/**/*.py"]
exclude = [".venv"]
lint.ignore = ["E731"]

[tool.pyright]
venv = ".venv"
venvPath = "."
typeCheckingMode = "basic"
reportPrivateImportUsage = false

[tool.ty.src]
exclude = ["hatch_build.py", "third_party/**", ".venv/**", "benchmarks/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
