[project]
name = "scaly"
version = "0.1.0"
description = "A symbolic IR and code-generation framework for optimal control problems."
readme = "README.md"
authors = [
    { name = "Tudor Oancea", email = "oancea.tudor@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.3",
    "scipy>=1.18.0",
]
license = "BSD-2-Clause"
license-files = ["LICENSE.md"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scaly"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "scaly-ipopt",
    "scaly-piqp",
    "scaly-sqp",
    "casadi>=3.8.0",
    "pytest>=8.4.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.13.3",
    "ty>=0.0.75",
    "matplotlib>=3.11.0",
    "foxglove-sdk>=0.25.3",
    "pydantic>=2.13.4",
    "scipy>=1.14",
]
docs = [
    "zensical>=0.0.28",
    "mkdocstrings-python>=2.0.3",
]

[project.scripts]
scaly_viz = "scaly.viz.serve:main"
scaly_toolchain = "scaly.codegen.toolchain:main"

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
scaly-ipopt = { workspace = true }
scaly-piqp = { workspace = true }
scaly-sqp = { workspace = true }

[tool.ruff]
indent-width = 2
line-length = 150
target-version = "py312"
include = ["src/scaly/**/*.py", "tests/**/*.py", "benchmarks/**/*.py", "plugins/**/*.py", "typing_playground/**/*.py"]
exclude = [".venv"]
lint.ignore = ["E731"]

[tool.pyright]
venv = ".venv"
venvPath = "."
typeCheckingMode = "basic"
reportPrivateImportUsage = false

[tool.ty.src]
exclude = ["hatch_build.py", "third_party/**", "plugins/*/hatch_build.py", "plugins/*/third_party/**", ".venv/**", "benchmarks/**", "internal/**"]

[tool.pytest.ini_options]
testpaths = ["tests", "plugins", "typing_playground"]
norecursedirs = ["third_party", ".venv"]
markers = ["solver(name): needs a loadable vendored solver; skipped without it, selected by CI's solver job"]
