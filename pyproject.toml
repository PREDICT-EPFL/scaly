[project]
name = "alloy"
version = "0.1.0"
description = "A symbolic IR and code-generation framework for optimal control problems."
readme = "README.md"
authors = [
    { name = "Tudor Oancea", email = "oancea.tudor@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alloy"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "alloy-ipopt",
    "alloy-piqp",
    "alloy-sqp",
    "casadi>=3.7.2",
    "pytest>=8.4.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.13.3",
    "ty>=0.0.2",
    "matplotlib>=3.11.0",
    "foxglove-sdk>=0.25.3",
    "pydantic>=2.13.4",
]
docs = [
    "zensical>=0.0.28",
    "mkdocstrings-python>=2.0.3",
]

[project.scripts]
alloy_viz = "alloy.viz.serve:main"
alloy_toolchain = "alloy.codegen.toolchain:main"

[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
alloy-ipopt = { workspace = true }
alloy-piqp = { workspace = true }
alloy-sqp = { workspace = true }

[tool.ruff]
indent-width = 2
line-length = 150
target-version = "py312"
include = ["src/alloy/**/*.py", "tests/**/*.py", "benchmarks/**/*.py", "plugins/**/*.py"]
exclude = [".venv"]
lint.ignore = ["E731"]

[tool.pyright]
venv = ".venv"
venvPath = "."
typeCheckingMode = "basic"
reportPrivateImportUsage = false

[tool.ty.src]
exclude = ["hatch_build.py", "third_party/**", "plugins/*/hatch_build.py", "plugins/*/third_party/**", ".venv/**", "benchmarks/**"]

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
norecursedirs = ["third_party", ".venv"]
markers = ["solver(name): needs a loadable vendored solver; skipped without it, selected by CI's solver job"]
