# Generated from distributions.toml by scripts/distributions.py; edit the table and rerun it.

[project]
name = "scaly-numerics"
version = "0.1.0a1"
description = "Numerical methods for scaly as generated code: linear algebra, nonlinear equations, optimization, integrators and interpolation."
requires-python = ">=3.12"
dependencies = ["scaly-core==0.1.0a1"]
license = "BSD-2-Clause"
license-files = ["LICENSE.md"]
authors = [{ name = "Tudor Oancea", email = "tudor.oancea@epfl.ch" }]
keywords = [
  "optimal-control",
  "automatic-differentiation",
  "code-generation",
  "symbolic",
  "sparse",
  "mpc",
  "nonlinear-programming",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Compilers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/PREDICT-EPFL/scaly"
Issues = "https://github.com/PREDICT-EPFL/scaly/issues"

[project.entry-points."scaly.methods"]
"opt.ipm" = "scaly.opt.ipm:IPM"
"roots.newton" = "scaly.roots.newton:Newton"
"roots.newton_bisection" = "scaly.roots.newton:NewtonBisection"
"roots.gauss_newton" = "scaly.roots.least_squares:GaussNewton"
"roots.levenberg_marquardt" = "scaly.roots.least_squares:LevenbergMarquardt"
"integrators.adaptive" = "scaly.integrators.methods:Adaptive"
"integrators.backward_euler" = "scaly.integrators.methods:BackwardEuler"
"integrators.bs32" = "scaly.integrators.methods:BS32"
"integrators.dopri5" = "scaly.integrators.methods:DOPRI5"
"integrators.euler" = "scaly.integrators.methods:Euler"
"integrators.gauss_legendre" = "scaly.integrators.methods:GaussLegendre"
"integrators.heun" = "scaly.integrators.methods:Heun"
"integrators.implicit_midpoint" = "scaly.integrators.methods:ImplicitMidpoint"
"integrators.lobatto_iiia" = "scaly.integrators.methods:LobattoIIIA"
"integrators.lobatto_iiic" = "scaly.integrators.methods:LobattoIIIC"
"integrators.midpoint" = "scaly.integrators.methods:Midpoint"
"integrators.radau_iia" = "scaly.integrators.methods:RadauIIA"
"integrators.ralston" = "scaly.integrators.methods:Ralston"
"integrators.rk3" = "scaly.integrators.methods:RK3"
"integrators.rk38" = "scaly.integrators.methods:RK38"
"integrators.rk4" = "scaly.integrators.methods:RK4"
"integrators.sdirk2" = "scaly.integrators.methods:SDIRK2"
"integrators.sdirk3" = "scaly.integrators.methods:SDIRK3"
"integrators.ssprk3" = "scaly.integrators.methods:SSPRK3"
"integrators.stormer_verlet" = "scaly.integrators.methods:StormerVerlet"
"integrators.symplectic_euler" = "scaly.integrators.methods:SymplecticEuler"
"integrators.trapezoidal" = "scaly.integrators.methods:Trapezoidal"
"integrators.tsit5" = "scaly.integrators.methods:Tsit5"
"interp.akima" = "scaly.interp.methods:Akima"
"interp.constrained" = "scaly.interp.methods:Constrained"
"interp.cubic" = "scaly.interp.methods:Cubic"
"interp.linear" = "scaly.interp.methods:Linear"
"interp.makima" = "scaly.interp.methods:Makima"
"interp.nearest" = "scaly.interp.methods:Nearest"
"interp.pchip" = "scaly.interp.methods:PCHIP"
"interp.smooth_linear" = "scaly.interp.methods:SmoothLinear"
"interp.smoothing" = "scaly.interp.methods:Smoothing"
"interp.spline" = "scaly.interp.methods:Spline"
"interp.steffen" = "scaly.interp.methods:Steffen"
"interp.zoh" = "scaly.interp.methods:ZOH"

[project.entry-points."scaly.toolchain_report"]
solvers = "scaly.opt.external.paths:toolchain_report"

[project.entry-points."scaly.env_vars"]
solvers = "scaly.opt.external.paths:SOLVER_ENV_VARS"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
dev-mode-dirs = ["../../src"]

[tool.hatch.build.hooks.custom]
paths = ["scaly/linalg", "scaly/roots", "scaly/opt", "scaly/integrators", "scaly/interp"]

[tool.uv.sources]
scaly-core = { workspace = true }
