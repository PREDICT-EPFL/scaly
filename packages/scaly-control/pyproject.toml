# Generated from distributions.toml by scripts/distributions.py; edit the table and rerun it.

[project]
name = "scaly-control"
version = "0.1.0a1"
description = "Optimal control for scaly: continuous and discrete OCPs, their transcription, formulation and methods, and sets in state space."
requires-python = ">=3.12"
dependencies = ["scaly-numerics==0.1.0a1"]
license = "BSD-2-Clause"
license-files = ["LICENSE.md"]
authors = [{ name = "Tudor Oancea", email = "tudor.oancea@epfl.ch" }]
keywords = [
  "optimal-control",
  "automatic-differentiation",
  "code-generation",
  "symbolic",
  "sparse",
  "mpc",
  "nonlinear-programming",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Compilers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/PREDICT-EPFL/scaly"
Issues = "https://github.com/PREDICT-EPFL/scaly/issues"

[project.entry-points."scaly.methods"]
"ocp.direct" = "scaly.ocp.direct:Direct"
"ocp.ilqr" = "scaly.ocp.ilqr:ILQR"
"ocp.tinyadmm" = "scaly.ocp.tinyadmm:TinyADMM"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
dev-mode-dirs = ["../../src"]

[tool.hatch.build.hooks.custom]
paths = ["scaly/ocp", "scaly/sets"]
exclude = ["scaly/ocp/altro.py", "scaly/ocp/scvx.py"]

[tool.uv.sources]
scaly-numerics = { workspace = true }
